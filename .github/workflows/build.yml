name: Build

# Compiles and tests every push and pull request.
#
# This exists because a commit that did not compile reached the trunk: a
# progress message was narrowed to one argument and one of its two call
# sites was left behind. CONTRIBUTING.md already asks for ALL.compile
# before committing; this enforces it.

on:
  push:
    branches: [cloud]
  pull_request:
    branches: [cloud]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # See .github/workflows/release.yml for why this is a JavaFX bundle
      # rather than the Oracle JDK the documentation calls for.
      - name: Set up Java 8 with JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
          java-package: 'jdk+fx'

      - name: Set up Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # Compilation is the gate: it must never fail.
      - name: Compile
        run: |
          cd ant
          ant -f runGenerated.xml ALL.compile \
            -Djdk="$JAVA_HOME" \
            -Dbuild.number="${GITHUB_RUN_NUMBER}"

      # ReferredByQueryTests fails in the full run and passes in isolation
      # (shared JVM per module, SQLite exhausting temporary storage). The
      # result is reported but does not fail the job, so a real regression
      # still has to be read from the log rather than inferred from a tick.
      - name: Test
        continue-on-error: true
        run: |
          cd ant
          ant -f build.xml prepareDistribution \
            -Djdk="$JAVA_HOME" \
            -Dbuild.number="${GITHUB_RUN_NUMBER}"
